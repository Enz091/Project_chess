# Réseau plus gros pour les entraînements sur GPU Kaggle.
[model]
n_blocks = 10
n_filters = 128
value_hidden = 128

# Pré-entraînement supervisé sur GPU Kaggle (T4 / P100).
[train]
batch_size = 1024        # lot plus grand pour occuper le GPU
lr = 2e-3                # un peu plus haut qu'en tiny, car le lot est 4 fois plus grand
weight_decay = 0.01
warmup_steps = 1000
min_lr_ratio = 0.01
total_steps = 92000      # 4 époques de 23,56 M de positions (23 008 pas/époque à 1024 par lot), ~3 h 30 à 8 000 pos/s
grad_clip = 1.0
log_every = 100
eval_every = 1000
save_every = 500         # reprise possible après une coupure de session
keep_last = 3
val_positions = 100000     # sous-ensemble fixe ; 30 000 positions de peu de parties donnaient une perte valeur trop bruitée
amp = "auto"             # fp16 + GradScaler sur CUDA
num_workers = 3          # Kaggle : 4 cœurs CPU
mask_train_loss = true   # false : perte politique sans masque (voir docs/journal.md)
seed = 0

# Recherche MCTS (étape 5). Bruit et température désactivés par défaut : ils serviront au self-play.
[mcts]
num_simulations = 200    # simulations ajoutées par recherche
c_puct = 1.5             # poids de l'exploration (valeurs dans [-1, 1])
batch_size = 8           # feuilles par appel au réseau ; 8 = 2x plus rapide que 1 sans changer la recherche (journal)
virtual_loss = 1.0       # une visite virtuelle compte comme une défaite
fpu_reduction = 0.2      # Q d'un coup jamais visité = Q(nœud, camp qui choisit) - 0,2
dirichlet_alpha = 0.3    # bruit de la racine (valeur AlphaZero pour les échecs)
dirichlet_epsilon = 0.0  # 0 = pas de bruit ; 0,25 en self-play
temperature = 0.0        # 0 = coup le plus visité ; 1 en début de partie en self-play

# Self-play (étape 6c), plan validé le 2026-10-21 (voir CLAUDE.md et docs/journal.md).
[selfplay]
simulations = 200              # nouvelles simulations par coup, toutes enregistrées (pas de playout cap randomization)
leaves_per_tree = 4            # feuilles par arbre et par appel au réseau (lots de games_per_worker x 4)
games_per_worker = 64          # parties menées ensemble par processus (à ajuster après la mesure Kaggle, 6e)
dirichlet_alpha = 0.3
dirichlet_epsilon = 0.25       # bruit neuf à la racine à chaque coup
temperature = 1.0
temperature_plies = 30         # tirage selon les visites tant que le demi-coup de la partie est < 30
temperature_min_visit_ratio = 0.1  # seulement parmi les coups à >= 10 % des visites du meilleur
book_fraction = 0.9            # 90 % des parties partent du livre, 10 % de la position initiale
resign_threshold = -0.90       # Q racine ET Q du meilleur coup sous ce seuil...
resign_consecutive = 3         # ... pendant 3 coups d'affilée du même camp...
resign_min_ply = 20            # ... à partir du demi-coup 20
no_resign_fraction = 0.10      # parties de contrôle (sans abandon) : mesure des faux abandons
max_plies = 400                # nulle au-delà
tablebase_pieces = 5           # arbitrage par les tables dès 5 pièces (WDL seul suffit)
shard_games = 100              # un fichier tous les 100 parties...
shard_minutes = 10.0           # ... ou toutes les 10 minutes
buffer_positions = 500000      # fenêtre du tampon gardée d'une session à l'autre
stop_new_games_minutes = 20.0  # plus de nouvelles parties 20 min avant la fin du budget
hard_stop_minutes = 5.0        # arrêt 5 min avant la fin (parties inachevées perdues)

# Arène (étape 7a), plan validé le 2026-10-22 (voir CLAUDE.md et docs/journal.md).
[arena]
pairs = 100                    # contre le réseau accepté : 100 ouvertures x 2 couleurs = 200 parties
anchor_pairs = 100             # contre l'ancre kaggle_sup : 100 ouvertures fixes x 2 couleurs
simulations = 200              # par coup (= self-play et mesure v2)
leaves_per_tree = 4
games_per_worker = 64
resign_threshold = -0.90       # abandon seulement si les deux camps sont d'accord...
resign_consecutive = 3         # ... sur leurs 3 derniers coups...
resign_min_ply = 20            # ... à partir du demi-coup 20
max_plies = 400
tablebase_pieces = 5
accept_score = 0.52            # acceptation : >= 104 points sur 200 (~ +14 Elo)
anchor_veto_se = 2.0           # veto : Elo contre l'ancre < celui de l'accepté - 2 erreurs types de l'écart

# Entraînement sur le self-play (étape 6d), choix validés le 2026-10-22 (voir CLAUDE.md et docs/journal.md).
[selfplay_train]
batch_size = 1024
lr = 2e-4                      # constant après la montée...
lr_start = 2e-5                # ... depuis 2e-5 (fin du pré-entraînement) sur 300 pas ; AdamW neuf
warmup_steps = 300
lr_min = 2.5e-5                # plancher après des divisions par 2 (G1)
weight_decay = 0.01
grad_clip = 1.0
buffer_positions = 500000      # fenêtre du tampon
reuse = 4.0                    # passages moyens par nouvelle position (1 pas pour 192 nouvelles à 25 % humain)
reduced_reuse = 2.0            # après un rejet pour surapprentissage
max_views_per_round = 1.0      # plafond : 1 passage moyen par position du tampon dans un même tour
min_buffer_positions = 250000  # premier tour seulement quand le tampon (hors parties de côté) atteint ce nombre
human_fraction = 0.25          # positions Lichess par lot (composition exacte)...
human_fraction_late = 0.10     # ... puis 10 %...
human_switch_generation = 5    # ... à partir de la 6e génération acceptée
value_target = "result"        # "blend" = (résultat + Q racine) / 2, à évaluer (scripts/eval_value_target.py)
heldout_fraction = 0.10        # parties de self-play mises de côté (surapprentissage, évaluation)
lichess_val_positions = 50000  # sous-ensemble fixe de la validation Lichess
early_generations = 5          # G1 / G2 stricts pendant ces générations
g1_policy_loss = 0.05
g2_top1_points = 3.0
catastrophic_policy_loss = 0.15  # ensuite : rejet seulement au-delà
catastrophic_top1_points = 10.0
jump_policy_loss = 0.05        # alerte : chute brutale depuis la génération précédente
jump_top1_points = 2.0
g3_value_loss = 0.05           # alerte : perte de valeur Lichess
max_rejections = 3             # G4 (rejets par les garde-fous d'affilée)
max_arena_rejections = 5       # étape 7 : arrêt après 5 rejets en arène d'affilée (stagnation)
anchor_stop_generations = 2    # étape 7 : arrêt si l'accepté est sous kaggle_sup (borne haute < 0) sur 2 générations
anchor_stop_from_generation = 3  # ... consécutives, générations >= 3 seulement (premier arrêt possible : génération 4)
save_every = 100
log_every = 20
amp = "auto"
num_workers = 3
seed = 0

# Boucle AlphaZero (étape 7d), plan validé le 2026-10-22 (voir CLAUDE.md et docs/journal.md).
[loop]
new_positions_per_generation = 100000  # self-play entre deux tours (~85 min) ; à ajuster selon le taux d'acceptation
start_margin_minutes = 15.0     # marge avant un tour (entraînement + arènes estimés) ou une arène
end_margin_minutes = 10.0       # fin de session : rapport, sauvegarde de la sortie
min_chunk_minutes = 10.0        # tranche de self-play minimale
chunk_stop_new_games_minutes = 12.0  # tranche : plus de nouvelles parties 12 min avant sa fin
control_a_pairs = 10            # contrôle (a) : kaggle_sup contre lui-même (avertissement seulement)
control_a_low = 0.40
control_a_high = 0.60
control_b_pairs = 20            # contrôle (b) : 200 contre 50 simulations (bloquant sous 70 %)
control_b_weak_simulations = 50
control_b_min_score = 0.70
# estimations de départ (remplacées par la moyenne des 3 dernières mesures), d'après la session de self-play seul
# sur Kaggle du 2026-10-22 : 4 296 simulations/s, 77 300 positions/h, 97,5 coups cherchés par partie
est_positions_per_minute = 1290.0
est_train_fixed_minutes = 5.0
est_train_minutes_per_step = 0.006
est_arena_fixed_minutes = 1.0
est_simulations_per_second = 4296.0
est_arena_searched_moves_per_game = 97.5   # -> 0,083 min par partie d'arène à 200 simulations (200 parties ~17,6 min)
est_arena_slowdown = 1.10
estimate_window = 3
max_phase_failures = 2          # une phase en échec est rejouée une fois ; arrêt au 2e échec
v2_anchor_gain = 50.0           # « Actions » : mesure v2 si l'Elo contre l'ancre (lissé) a gagné > 50...
v2_max_generations = 10         # ... ou au plus tard toutes les 10 générations acceptées
false_resign_alert = 0.05
early_repetition_alert = 0.05
repetition_material_reference = 0.145   # session de référence : 552 sur 3 803 parties finies par répétition avec >= 20 points
repetition_material_alert_points = 5.0  # « Actions » : alerte au-delà de 19,5 %
throughput_drop_alert = 0.15
reading_alert = 0.30            # « Actions » : lecture des données > 30 % du temps d'un tour
