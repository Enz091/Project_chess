# Réseau plus gros pour les entraînements sur GPU Kaggle.
[model]
n_blocks = 10
n_filters = 128
value_hidden = 128

# Pré-entraînement supervisé sur GPU Kaggle (T4 / P100).
[train]
batch_size = 1024        # lot plus grand pour occuper le GPU
lr = 2e-3                # un peu plus haut qu'en tiny, car le lot est 4 fois plus grand
weight_decay = 0.01
warmup_steps = 1000
min_lr_ratio = 0.01
total_steps = 92000      # 4 époques de 23,56 M de positions (23 008 pas/époque à 1024 par lot), ~3 h 30 à 8 000 pos/s
grad_clip = 1.0
log_every = 100
eval_every = 1000
save_every = 500         # reprise possible après une coupure de session
keep_last = 3
val_positions = 100000     # sous-ensemble fixe ; 30 000 positions de peu de parties donnaient une perte valeur trop bruitée
amp = "auto"             # fp16 + GradScaler sur CUDA
num_workers = 3          # Kaggle : 4 cœurs CPU
mask_train_loss = true   # false : perte politique sans masque (voir docs/journal.md)
seed = 0

# Recherche MCTS (étape 5). Bruit et température désactivés par défaut : ils serviront au self-play.
[mcts]
num_simulations = 200    # simulations ajoutées par recherche
c_puct = 1.5             # poids de l'exploration (valeurs dans [-1, 1])
batch_size = 8           # feuilles par appel au réseau ; 8 = 2x plus rapide que 1 sans changer la recherche (journal)
virtual_loss = 1.0       # une visite virtuelle compte comme une défaite
fpu_reduction = 0.2      # Q d'un coup jamais visité = Q(nœud, camp qui choisit) - 0,2
dirichlet_alpha = 0.3    # bruit de la racine (valeur AlphaZero pour les échecs)
dirichlet_epsilon = 0.0  # 0 = pas de bruit ; 0,25 en self-play
temperature = 0.0        # 0 = coup le plus visité ; 1 en début de partie en self-play
